<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felices 13 Meses ❤️</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>🎉 Felices 13 meses desde que nos conocimos 🎉</h2>
    <p>Hoy celebramos nuestra historia ❤️</p>
    <button onclick="iniciarSorpresa()">Abrir sorpresa</button>
  </div>
</div>

<!-- CIELO ESTRELLADO -->
<div class="stars"></div>

<div class="container">

  <h1>Para mi persona favorita 🐶💖</h1>

  <!-- CONTADOR -->
  <div id="contador"></div>

  <!-- SNOOPY Y CASITA -->
  <div class="escena">
    <div class="casa"></div>
    <div class="snoopy" id="snoopy">🐶</div>
  </div>

  <!-- MENSAJE -->
  <p id="mensaje"></p>

  <!-- PREGUNTA -->
  <div class="pregunta">
    <h2>¿Quieres seguir conmigo toda la vida? 💕</h2>
    <button onclick="respuestaSi()">Sí ❤️</button>
    <button id="noBtn">No 😢</button>
  </div>

  <p id="respuestaFinal"></p>

</div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
